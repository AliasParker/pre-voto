services:
  caddy:
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - /etc/caddy/origin.crt:/etc/caddy/origin.crt:ro
      - /etc/caddy/origin.key:/etc/caddy/origin.key:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ./frontend
      target: prod
    volumes:
      - frontend_dist:/srv:ro

  frontend-builder:
    build:
      context: ./frontend
      target: builder
    profiles:
      - build
    environment:
      - API_INTERNAL_URL=http://api:8000
    volumes:
      - frontend_dist:/app/dist
    networks:
      - prevoto

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes: []

  worker:
    volumes: []

  mailpit:
    profiles:
      - never

volumes:
  frontend_dist:
